<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petio — AI Chatbox User Flow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8f9fa;
    padding: 32px;
    color: #1a1a2e;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
  .legend {
    display: flex; gap: 20px; margin-bottom: 20px; font-size: 12px; color: #555;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-shape {
    width: 28px; height: 18px; border: 1.5px solid #444; background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 9px;
  }
  .legend-shape.diamond { transform: rotate(45deg); width: 16px; height: 16px; border-radius: 2px; }
  .legend-shape.rounded { border-radius: 8px; }
  .legend-shape.circle { width: 18px; height: 18px; border-radius: 50%; }
  .legend-shape.start { background: #fff; border: 2.5px solid #1a1a2e; }
  .legend-shape.end { background: #1a1a2e; }
  .legend-shape.widget { background: #e8f4fd; border-color: #2196F3; }
  .legend-shape.text-resp { background: #f0faf0; border-color: #4CAF50; }
  .legend-shape.scan-resp { background: #fff3e0; border-color: #F57C00; }
  .legend-shape.path-a { border-color: #4CAF50; border-width: 2px; }
  .legend-shape.path-b { border-color: #F57C00; border-width: 2px; }
  .legend-shape.path-c { border-color: #2196F3; border-width: 2px; }

  svg {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: block;
  }
</style>
</head>
<body>

<h1>AI CHATBOX — User Flow (BPMN)</h1>
<p class="subtitle">Petio App · 2 swim lanes: NGƯỜI DÙNG (User) &amp; HỆ THỐNG (System) · 3 input paths</p>

<div class="legend">
  <div class="legend-item"><div class="legend-shape circle start"></div> Start</div>
  <div class="legend-item"><div class="legend-shape circle end"></div> End</div>
  <div class="legend-item"><div class="legend-shape rounded"></div> User Action</div>
  <div class="legend-item"><div class="legend-shape"></div> System Process</div>
  <div class="legend-item"><div class="legend-shape diamond"></div> Decision</div>
  <div class="legend-item"><div class="legend-shape path-a rounded"></div> Path A: Text</div>
  <div class="legend-item"><div class="legend-shape path-b rounded"></div> Path B: Scan</div>
  <div class="legend-item"><div class="legend-shape path-c rounded"></div> Path C: Document</div>
  <div class="legend-item"><div class="legend-shape text-resp rounded"></div> Text Response</div>
  <div class="legend-item"><div class="legend-shape scan-resp rounded"></div> Widget Response</div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 960" width="1700" height="960">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2196F3"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4CAF50"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F57C00"/>
    </marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ==================== SWIM LANES ==================== -->
  <rect x="40" y="30" width="1620" height="900" rx="0" fill="none" stroke="#3a5ba0" stroke-width="2.5"/>

  <!-- Flow title label (vertical) -->
  <rect x="40" y="30" width="50" height="900" fill="#edf1f7" stroke="#3a5ba0" stroke-width="2.5"/>
  <text x="65" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e6b" transform="rotate(-90,65,480)">AI CHATBOX</text>

  <!-- NGƯỜI DÙNG lane -->
  <rect x="90" y="30" width="1570" height="360" fill="#fefefe" stroke="#3a5ba0" stroke-width="1.5"/>
  <rect x="90" y="30" width="50" height="360" fill="#f4f6fb" stroke="#3a5ba0" stroke-width="1.5"/>
  <text x="115" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e6b" transform="rotate(-90,115,210)">NGƯỜI DÙNG</text>

  <!-- HỆ THỐNG lane -->
  <rect x="90" y="390" width="1570" height="540" fill="#fafbfe" stroke="#3a5ba0" stroke-width="1.5"/>
  <rect x="90" y="390" width="50" height="540" fill="#f4f6fb" stroke="#3a5ba0" stroke-width="1.5"/>
  <text x="115" y="660" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e6b" transform="rotate(-90,115,660)">HỆ THỐNG</text>

  <!-- ==================== USER LANE ==================== -->

  <!-- START -->
  <circle cx="180" cy="160" r="16" fill="#fff" stroke="#1a1a2e" stroke-width="3"/>
  <line x1="196" y1="160" x2="222" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1. Mở Chat -->
  <g class="node">
    <rect x="230" y="132" width="135" height="56" rx="28" fill="#fff" stroke="#555" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="297" y="153" text-anchor="middle" font-size="10" font-weight="600">1. Mở Chat</text>
    <text x="297" y="167" text-anchor="middle" font-size="8.5" fill="#777">Tap "Chat with Peti"</text>
    <text x="297" y="179" text-anchor="middle" font-size="8.5" fill="#777">hoặc Peti icon</text>
  </g>

  <!-- Arrow down to system (greeting) -->
  <line x1="297" y1="188" x2="297" y2="440" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- 2. Chọn input (gateway diamond) -->
  <g class="node" transform="translate(520, 132)">
    <rect x="0" y="0" width="50" height="50" rx="3" transform="rotate(45,25,25)" fill="#fff" stroke="#555" stroke-width="1.5"/>
    <text x="25" y="22" text-anchor="middle" font-size="8" font-weight="600">Chọn</text>
    <text x="25" y="32" text-anchor="middle" font-size="8" font-weight="600">input</text>
  </g>
  <!-- Arrow from greeting back up to gateway (via system) -->
  <line x1="440" y1="160" x2="517" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== PATH A: Type question ===== -->
  <g class="node">
    <rect x="620" y="55" width="150" height="50" rx="25" fill="#fff" stroke="#4CAF50" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="695" y="74" text-anchor="middle" font-size="10" font-weight="600" fill="#2e7d32">2A. Nhập câu hỏi</text>
    <text x="695" y="88" text-anchor="middle" font-size="8.5" fill="#777">Gõ text / chọn gợi ý</text>
  </g>
  <path d="M552,140 L580,80 L618,80" fill="none" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="565" y="100" font-size="9" fill="#4CAF50" font-weight="600">A</text>

  <!-- Arrow from 2A down to system -->
  <path d="M770,80 L795,80 L795,460 L818,460" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- ===== PATH B: Scan product ===== -->
  <g class="node">
    <rect x="620" y="175" width="150" height="50" rx="25" fill="#fff" stroke="#F57C00" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="695" y="194" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">2B. Quét sản phẩm</text>
    <text x="695" y="208" text-anchor="middle" font-size="8.5" fill="#777">Mở camera / barcode</text>
  </g>
  <path d="M570,160 L590,200 L618,200" fill="none" stroke="#F57C00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="578" y="192" font-size="9" fill="#F57C00" font-weight="600">B</text>

  <!-- Arrow from 2B down to system -->
  <path d="M770,200 L805,200 L805,590 L818,590" fill="none" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>

  <!-- ===== PATH C: Upload document ===== -->
  <g class="node">
    <rect x="620" y="280" width="150" height="50" rx="25" fill="#fff" stroke="#2196F3" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="695" y="299" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">2C. Tải tài liệu</text>
    <text x="695" y="313" text-anchor="middle" font-size="8.5" fill="#777">Ảnh / sổ tiêm / hồ sơ</text>
  </g>
  <path d="M558,175 L590,305 L618,305" fill="none" stroke="#2196F3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="570" y="268" font-size="9" fill="#2196F3" font-weight="600">C</text>

  <!-- Arrow from 2C down to system -->
  <path d="M770,305 L815,305 L815,740 L818,740" fill="none" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>

  <!-- ===== 3. Xem phản hồi (User views response) ===== -->
  <g class="node">
    <rect x="1300" y="132" width="140" height="56" rx="28" fill="#fff" stroke="#555" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1370" y="155" text-anchor="middle" font-size="10" font-weight="600">3. Xem phản hồi</text>
    <text x="1370" y="169" text-anchor="middle" font-size="8.5" fill="#777">Text hoặc Widget</text>
  </g>

  <!-- ===== 4. Decision: continue or exit ===== -->
  <g class="node" transform="translate(1480, 132)">
    <rect x="0" y="0" width="50" height="50" rx="3" transform="rotate(45,25,25)" fill="#fff" stroke="#555" stroke-width="1.5"/>
    <text x="25" y="22" text-anchor="middle" font-size="7.5" font-weight="600">Tiếp</text>
    <text x="25" y="32" text-anchor="middle" font-size="7.5" font-weight="600">tục?</text>
  </g>
  <line x1="1440" y1="160" x2="1478" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes → loop back to gateway -->
  <path d="M1505,132 L1505,45 L545,45 L545,130" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1520" y="88" font-size="9" fill="#555" font-weight="600">Có</text>
  <text x="1000" y="39" text-anchor="middle" font-size="9" fill="#888" font-style="italic">Hỏi tiếp câu mới</text>

  <!-- No → END -->
  <circle cx="1600" cy="160" r="16" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="3"/>
  <circle cx="1600" cy="160" r="8" fill="#fff"/>
  <circle cx="1600" cy="160" r="5" fill="#1a1a2e"/>
  <line x1="1530" y1="160" x2="1582" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1554" y="152" font-size="8" fill="#555">Không</text>
  <text x="1600" y="192" text-anchor="middle" font-size="8" fill="#999">Về Homepage</text>

  <!-- ==================== SYSTEM LANE ==================== -->

  <!-- S1. Hiển thị lời chào -->
  <g class="node">
    <rect x="200" y="440" width="155" height="60" rx="4" fill="#fff" stroke="#555" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="277" y="460" text-anchor="middle" font-size="10" font-weight="600">S1. Hiển thị lời chào</text>
    <text x="277" y="475" text-anchor="middle" font-size="8.5" fill="#777">"Hi Pawrent, hôm nay</text>
    <text x="277" y="488" text-anchor="middle" font-size="8.5" fill="#777">Peti giúp gì được?"</text>
  </g>

  <!-- S2. Gợi ý câu hỏi -->
  <g class="node">
    <rect x="380" y="440" width="155" height="60" rx="4" fill="#f0faf0" stroke="#4CAF50" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="457" y="458" text-anchor="middle" font-size="9" font-weight="600" fill="#2e7d32">S2. Gợi ý câu hỏi</text>
    <text x="457" y="472" text-anchor="middle" font-size="8" fill="#666">• Thú cưng nên ăn gì?</text>
    <text x="457" y="484" text-anchor="middle" font-size="8" fill="#666">• Thức ăn này an toàn?</text>
    <text x="457" y="496" text-anchor="middle" font-size="8" fill="#666">• Thú cưng hành xử lạ</text>
  </g>
  <line x1="355" y1="470" x2="378" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from S2 back up to user gateway -->
  <path d="M457,440 L457,420 L540,420 L540,370 L545,370" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="545" y1="370" x2="545" y2="185" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dash)"/>

  <!-- =============================================
       PATH A: TEXT QUESTION (GREEN)
       ============================================= -->

  <!-- S3A. AI Processing (Text) -->
  <g class="node">
    <rect x="820" y="430" width="165" height="60" rx="4" fill="#fff" stroke="#4CAF50" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="902" y="449" text-anchor="middle" font-size="10" font-weight="600" fill="#2e7d32">S3A. Xử lý AI (Text)</text>
    <text x="902" y="464" text-anchor="middle" font-size="8.5" fill="#777">Đọc pet profile</text>
    <text x="902" y="477" text-anchor="middle" font-size="8.5" fill="#777">(tuổi, giống, cân nặng, dị ứng)</text>
  </g>

  <!-- S4A. Detect intent -->
  <g class="node">
    <rect x="1010" y="430" width="130" height="60" rx="4" fill="#fff" stroke="#4CAF50" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1075" y="449" text-anchor="middle" font-size="10" font-weight="600" fill="#2e7d32">S4A. Phát hiện intent</text>
    <text x="1075" y="464" text-anchor="middle" font-size="8.5" fill="#777">Health / Food /</text>
    <text x="1075" y="477" text-anchor="middle" font-size="8.5" fill="#777">Behavior</text>
  </g>
  <line x1="985" y1="460" x2="1008" y2="460" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- S5A. Text response -->
  <g class="node">
    <rect x="1168" y="430" width="130" height="60" rx="12" fill="#f0faf0" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <text x="1233" y="450" text-anchor="middle" font-size="10" font-weight="700" fill="#2e7d32">S5A. TEXT</text>
    <text x="1233" y="464" text-anchor="middle" font-size="8.5" fill="#555">Câu trả lời đơn giản</text>
    <text x="1233" y="477" text-anchor="middle" font-size="8.5" fill="#555">Do / Don't guidance</text>
  </g>
  <line x1="1140" y1="460" x2="1166" y2="460" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Arrow from S5A up to user "view response" -->
  <path d="M1298,460 L1340,460 L1340,370 L1370,370" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="1370" y1="370" x2="1370" y2="190" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- =============================================
       PATH B: SCAN PRODUCT (ORANGE)
       ============================================= -->

  <!-- S3B. Open camera / identify product -->
  <g class="node">
    <rect x="820" y="560" width="165" height="60" rx="4" fill="#fff" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="902" y="579" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">S3B. Nhận diện SP</text>
    <text x="902" y="594" text-anchor="middle" font-size="8.5" fill="#777">Quét barcode / hình ảnh</text>
    <text x="902" y="607" text-anchor="middle" font-size="8.5" fill="#777">Xác định sản phẩm</text>
  </g>

  <!-- S4B. Analyze ingredients -->
  <g class="node">
    <rect x="1010" y="560" width="130" height="60" rx="4" fill="#fff" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1075" y="579" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">S4B. Phân tích</text>
    <text x="1075" y="594" text-anchor="middle" font-size="8.5" fill="#777">Thành phần / loại SP</text>
    <text x="1075" y="607" text-anchor="middle" font-size="8.5" fill="#777">So sánh pet profile</text>
  </g>
  <line x1="985" y1="590" x2="1008" y2="590" stroke="#F57C00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- S5B. Widget response (scan result) -->
  <g class="node">
    <rect x="1168" y="560" width="130" height="60" rx="12" fill="#fff3e0" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
    <text x="1233" y="578" text-anchor="middle" font-size="10" font-weight="700" fill="#e65100">S5B. WIDGET</text>
    <text x="1233" y="593" text-anchor="middle" font-size="8.5" fill="#555">Safe / Caution / Unsafe</text>
    <text x="1233" y="607" text-anchor="middle" font-size="8.5" fill="#555">Lý do + khuyến nghị</text>
  </g>
  <line x1="1140" y1="590" x2="1166" y2="590" stroke="#F57C00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Arrow from S5B up to user "view response" -->
  <path d="M1298,590 L1355,590 L1355,370" fill="none" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="1355" y1="370" x2="1355" y2="190" stroke="#F57C00" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>

  <!-- =============================================
       PATH C: UPLOAD DOCUMENT (BLUE)
       ============================================= -->

  <!-- S3C. Upload / extract -->
  <g class="node">
    <rect x="820" y="700" width="165" height="60" rx="4" fill="#fff" stroke="#2196F3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="902" y="719" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">S3C. Trích xuất</text>
    <text x="902" y="734" text-anchor="middle" font-size="8.5" fill="#777">Upload ảnh / scan tài liệu</text>
    <text x="902" y="747" text-anchor="middle" font-size="8.5" fill="#777">Trích thông tin chính</text>
  </g>

  <!-- S4C. Understand context -->
  <g class="node">
    <rect x="1010" y="700" width="130" height="60" rx="4" fill="#fff" stroke="#2196F3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1075" y="719" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">S4C. Hiểu ngữ cảnh</text>
    <text x="1075" y="734" text-anchor="middle" font-size="8.5" fill="#777">Health / Vaccine /</text>
    <text x="1075" y="747" text-anchor="middle" font-size="8.5" fill="#777">Medical note</text>
  </g>
  <line x1="985" y1="730" x2="1008" y2="730" stroke="#2196F3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- S5C. Widget response (document summary) -->
  <g class="node">
    <rect x="1168" y="700" width="130" height="60" rx="12" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
    <text x="1233" y="718" text-anchor="middle" font-size="10" font-weight="700" fill="#1565C0">S5C. WIDGET</text>
    <text x="1233" y="733" text-anchor="middle" font-size="8.5" fill="#555">Tóm tắt tài liệu</text>
    <text x="1233" y="747" text-anchor="middle" font-size="8.5" fill="#555">Lưu vào pet profile</text>
  </g>
  <line x1="1140" y1="730" x2="1166" y2="730" stroke="#2196F3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrow from S5C up to user "view response" -->
  <path d="M1298,730 L1385,730 L1385,370" fill="none" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="1385" y1="370" x2="1385" y2="190" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>

  <!-- =============================================
       FOLLOW-UP SUGGESTIONS (System)
       ============================================= -->
  <g class="node">
    <rect x="1340" y="840" width="180" height="60" rx="4" fill="#f5f5f5" stroke="#555" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1430" y="860" text-anchor="middle" font-size="10" font-weight="600">S6. Gợi ý follow-up</text>
    <text x="1430" y="875" text-anchor="middle" font-size="8.5" fill="#777">Hỏi thêm / Lưu thông tin</text>
    <text x="1430" y="888" text-anchor="middle" font-size="8.5" fill="#777">Theo dõi sức khỏe</text>
